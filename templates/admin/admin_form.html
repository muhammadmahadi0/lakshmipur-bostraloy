{% extends "admin/_base.html" %}
{% block title %}New Admin{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 bangla mb-6">+ নতুন অ্যাডমিন</h1>
<form method="post" class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-md space-y-3">
  <div><label class="block text-sm font-medium mb-1">Name</label><input type="text" name="name" value="Admin" class="w-full px-3 py-2 border rounded-lg"></div>
  <div><label class="block text-sm font-medium mb-1">Email *</label><input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg"></div>
  <div><label class="block text-sm font-medium mb-1 bangla">পাসওয়ার্ড *</label><input type="password" name="password" required minlength="8" class="w-full px-3 py-2 border rounded-lg"></div>
  <div><label class="block text-sm font-medium mb-1">Role</label>
    <select name="role" class="w-full px-3 py-2 border rounded-lg">
      <option value="staff">Staff</option>
      <option value="manager">Manager</option>
      <option value="owner">Owner</option>
    </select>
  </div>
  <div class="flex gap-2">
    <button class="bg-emerald-700 text-white px-6 py-2 rounded-lg">তৈরি করুন</button>
    <a href="/admin/admins/" class="bg-gray-200 px-6 py-2 rounded-lg">Cancel</a>
  </div>
</form>
{% endblock %}
