{% extends "admin/_base.html" %}
{% block title %}{% if coupon %}Edit{% else %}New{% endif %} Coupon{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 bangla mb-6">{% if coupon %}✏️ কুপন সম্পাদনা{% else %}+ নতুন কুপন{% endif %}</h1>
<form method="post" class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-xl space-y-3">
  <div><label class="block text-sm font-medium mb-1">Code *</label><input type="text" name="code" required value="{{ coupon.code if coupon else '' }}" class="w-full px-3 py-2 border rounded-lg uppercase font-mono" style="text-transform:uppercase"></div>
  <div><label class="block text-sm font-medium mb-1 bangla">বিবরণ</label><input type="text" name="description" value="{{ coupon.description if coupon else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-sm font-medium mb-1">Type</label>
      <select name="discount_type" class="w-full px-3 py-2 border rounded-lg">
        <option value="percent" {% if coupon and coupon.discount_type == 'percent' %}selected{% endif %}>Percent (%)</option>
        <option value="flat" {% if coupon and coupon.discount_type == 'flat' %}selected{% endif %}>Flat (৳)</option>
      </select>
    </div>
    <div><label class="block text-sm font-medium mb-1">Value</label><input type="number" step="0.01" name="discount_value" value="{{ coupon.discount_value if coupon else '0' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-sm font-medium mb-1 bangla">মিনিমাম অর্ডার</label><input type="number" step="0.01" name="min_order" value="{{ coupon.min_order if coupon else '0' }}" class="w-full px-3 py-2 border rounded-lg"></div>
    <div><label class="block text-sm font-medium mb-1 bangla">সর্বোচ্চ ব্যবহার (০=আনলিমিটেড)</label><input type="number" name="max_uses" value="{{ coupon.max_uses if coupon else '0' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  </div>
  <div><label class="block text-sm font-medium mb-1 bangla">মেয়াদ শেষ (ঐচ্ছিক)</label><input type="datetime-local" name="expires_at" value="{{ coupon.expires_at.strftime('%Y-%m-%dT%H:%M') if coupon and coupon.expires_at else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  <label class="flex items-center gap-2"><input type="checkbox" name="is_active" {% if coupon is none or coupon.is_active %}checked{% endif %}> <span class="bangla">সক্রিয়</span></label>
  <div class="flex gap-2">
    <button class="bg-emerald-700 text-white px-6 py-2 rounded-lg">Save</button>
    <a href="/admin/coupons/" class="bg-gray-200 px-6 py-2 rounded-lg">Cancel</a>
  </div>
</form>
{% endblock %}
