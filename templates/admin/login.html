{% extends "admin/_base.html" %}
{% block title %}Login{% endblock %}
{% block unauth_content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-700 to-emerald-900 p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-800 bangla">লক্ষ্মীপুর বস্ত্রালয়</h1>
      <p class="text-sm text-gray-600 mt-1 bangla">অ্যাডমিন প্যানেল লগইন</p>
    </div>
    <form method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required autofocus
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 bangla">পাসওয়ার্ড</label>
        <input type="password" name="password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
      </div>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <div class="p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2.5 rounded-lg font-medium transition">
        লগইন / Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
