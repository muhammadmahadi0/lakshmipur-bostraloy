{% extends "admin/_base.html" %}
{% block title %}{% if banner %}Edit{% else %}New{% endif %} Banner{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-gray-900 bangla mb-6">{% if banner %}✏️ ব্যানার সম্পাদনা{% else %}+ নতুন ব্যানার{% endif %}</h1>
<form method="post" class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 max-w-2xl space-y-3">
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-sm font-medium mb-1">Title (EN)</label><input type="text" name="title" value="{{ banner.title if banner else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
    <div><label class="block text-sm font-medium mb-1 bangla">টাইটেল (BN)</label><input type="text" name="title_bn" value="{{ banner.title_bn if banner else '' }}" class="w-full px-3 py-2 border rounded-lg bangla"></div>
    <div><label class="block text-sm font-medium mb-1">Subtitle (EN)</label><input type="text" name="subtitle" value="{{ banner.subtitle if banner else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
    <div><label class="block text-sm font-medium mb-1 bangla">সাবটাইটেল (BN)</label><input type="text" name="subtitle_bn" value="{{ banner.subtitle_bn if banner else '' }}" class="w-full px-3 py-2 border rounded-lg bangla"></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Image URL</label><input type="url" name="image_url" value="{{ banner.image_url if banner else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  <div><label class="block text-sm font-medium mb-1">Link URL</label><input type="url" name="link_url" value="{{ banner.link_url if banner else '' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  <div class="grid grid-cols-3 gap-3">
    <div><label class="block text-sm font-medium mb-1">Button (EN)</label><input type="text" name="button_text" value="{{ banner.button_text if banner else 'Shop Now' }}" class="w-full px-3 py-2 border rounded-lg"></div>
    <div><label class="block text-sm font-medium mb-1 bangla">বাটন (BN)</label><input type="text" name="button_text_bn" value="{{ banner.button_text_bn if banner else '' }}" class="w-full px-3 py-2 border rounded-lg bangla"></div>
    <div><label class="block text-sm font-medium mb-1">Sort</label><input type="number" name="sort_order" value="{{ banner.sort_order if banner else '0' }}" class="w-full px-3 py-2 border rounded-lg"></div>
  </div>
  <label class="flex items-center gap-2"><input type="checkbox" name="is_active" {% if banner is none or banner.is_active %}checked{% endif %}> <span class="bangla">সক্রিয়</span></label>
  <div class="flex gap-2">
    <button class="bg-emerald-700 text-white px-6 py-2 rounded-lg">Save</button>
    <a href="/admin/banners/" class="bg-gray-200 px-6 py-2 rounded-lg">Cancel</a>
  </div>
</form>
{% endblock %}
